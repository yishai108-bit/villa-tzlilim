<style>
/* Layout: the walkthrough video fills the screen and walks by itself; a tap pauses, a swipe skips to the next room; the room list and the photo galleries sit on top. */
:root {
  color-scheme: dark;
  --ink: #120e0b;
  --glass: rgba(18, 14, 11, .6);
  --sand: #f3ead9;
  --dune: #d3c3a8;
  --clay: #d58b52;
  --wa: #2f7a55;
  --side: 0px;
  --display: "Frank Ruhl Libre", "David", "Times New Roman", serif;
  --body: "Assistant", "Arial Hebrew", "Segoe UI", Arial, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { direction: rtl; background: var(--ink); color: var(--sand); font-family: var(--body); overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }

#stage { position: fixed; inset: 0 var(--side) 0 0; overflow: hidden; touch-action: none; cursor: pointer; background: var(--ink); }
#stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; background: var(--ink); transition: opacity .26s ease; }
#stage.contain video { object-fit: contain; }
#stage.fade video { opacity: 0; }
#stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 60%, rgba(18,14,11,.35)); }
.load { position: fixed; z-index: 2; left: calc((100% - var(--side)) / 2); top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; border: 3px solid rgba(243,234,217,.25); border-top-color: var(--sand); animation: spin 1s linear infinite; pointer-events: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.fastTag { position: fixed; z-index: 3; left: calc((100% - var(--side)) / 2); top: calc(150px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: var(--glass); color: var(--sand); font: 600 14px/1 var(--body); padding: 8px 14px; border-radius: 999px; pointer-events: none; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }

/* chrome */
.top {
  position: fixed; z-index: 4; inset: 0 var(--side) auto 0; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding-top: calc(12px + env(safe-area-inset-top, 0px)); padding-bottom: 44px;
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px));
  background: linear-gradient(to bottom, rgba(18,14,11,.6), rgba(18,14,11,0)); pointer-events: none;
}
.top > * { pointer-events: auto; }
.btn { border: 0; background: var(--glass); color: var(--sand); height: 44px; min-width: 44px; padding: 0 14px; border-radius: 999px; font: 600 15px/1 var(--body); display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn:disabled { opacity: .4; cursor: default; }
.btn:focus-visible, .wa:focus-visible, .rooms button:focus-visible, .bar:focus-visible { outline: 2px solid var(--clay); outline-offset: 2px; }
.brand { font: 700 20px/1 var(--display); letter-spacing: .01em; text-shadow: 0 1px 10px rgba(0,0,0,.5); }

.cap {
  position: fixed; z-index: 3; top: calc(68px + env(safe-area-inset-top, 0px)); right: calc(var(--side) + max(14px, env(safe-area-inset-right, 0px)));
  max-width: min(320px, calc(100vw - var(--side) - 28px)); background: var(--glass); border-radius: 14px; padding: 10px 14px 11px;
  display: grid; gap: 2px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); pointer-events: none; transition: opacity .18s ease;
}
.cap.swap { opacity: 0; }
.cap .where { font: 600 12px/1 var(--body); color: var(--clay); letter-spacing: .08em; }
.cap h1 { margin: 0; font: 500 23px/1.15 var(--display); }
.cap p { margin: 0; color: var(--dune); font-size: 14px; line-height: 1.35; }

/* walking controls */
.walk {
  position: fixed; z-index: 4; bottom: calc(82px + env(safe-area-inset-bottom, 0px));
  left: max(16px, env(safe-area-inset-left, 0px)); right: calc(var(--side) + max(16px, env(safe-area-inset-right, 0px)));
  display: grid; gap: 12px; justify-items: center;
}
.bar { position: relative; width: 100%; max-width: 400px; height: 20px; cursor: pointer; touch-action: none; }
.bar .track { position: absolute; inset: 8px 0; border-radius: 2px; background: rgba(243,234,217,.28); }
.bar .fill { position: absolute; top: 8px; bottom: 8px; right: 0; width: 0; border-radius: 2px; background: var(--sand); }
.bar .tick { position: absolute; top: 6px; width: 2px; height: 8px; margin-right: -1px; background: rgba(18,14,11,.7); }
.bar .knob { position: absolute; top: 4px; width: 12px; height: 12px; margin-right: -6px; border-radius: 50%; background: var(--sand); box-shadow: 0 1px 6px rgba(0,0,0,.5); }
.ctl { display: flex; align-items: center; gap: 12px; }
.ctl .go { width: 64px; height: 64px; border-radius: 50%; padding: 0; background: rgba(243,234,217,.92); color: var(--ink); }
.ctl .go svg { width: 30px; height: 30px; }
.ctl .go.on { background: var(--clay); color: #fff; }

.hint { position: fixed; z-index: 3; left: calc((100% - var(--side)) / 2); top: 50%; transform: translate(-50%, -50%); background: var(--glass); padding: 12px 18px; border-radius: 16px; font-size: 15px; line-height: 1.45; text-align: center; pointer-events: none; transition: opacity .6s; max-width: min(320px, calc(100vw - var(--side) - 32px)); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.hint.off { opacity: 0; }

.bottom {
  position: fixed; z-index: 4; inset: auto var(--side) 0 0; display: flex; justify-content: center;
  padding-top: 70px; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(to top, rgba(18,14,11,.88) 20%, rgba(18,14,11,0)); pointer-events: none;
}
.wa { pointer-events: auto; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; max-width: 400px; background: var(--wa); color: #fff; text-decoration: none; font: 700 17px/1 var(--body); padding: 15px 18px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
.wa svg { width: 22px; height: 22px; }

/* room list */
.rooms { position: fixed; z-index: 6; inset: 0; background: rgba(18,14,11,.7); display: none; justify-content: flex-start; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
body.menu .rooms { display: flex; }
.sheet { width: min(360px, 90vw); height: 100%; background: var(--ink); padding-top: calc(18px + env(safe-area-inset-top, 0px)); padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); padding-left: 14px; overflow-y: auto; display: grid; align-content: start; gap: 2px; }
.sheet h2 { margin: 0 4px 6px; font: 700 22px/1.2 var(--display); display: flex; justify-content: space-between; align-items: center; }
.sheet h3 { margin: 14px 4px 4px; font: 600 12px/1 var(--body); color: var(--clay); letter-spacing: .1em; }
.rooms button.r { text-align: right; border: 0; background: none; color: var(--sand); font: 600 16px/1.2 var(--body); padding: 6px; border-radius: 10px; cursor: pointer; display: grid; grid-template-columns: 48px 1fr; align-items: center; gap: 10px; }
.rooms button.r img { width: 48px; height: 64px; object-fit: cover; border-radius: 6px; background: #2a221c; display: block; }
.rooms button.r span { display: grid; gap: 3px; }
.rooms button.r small { color: var(--dune); font-weight: 400; font-size: 13px; }
.rooms button.r[aria-current="true"] { background: rgba(213,139,82,.18); color: var(--clay); }
.rooms button.r:hover { background: rgba(243,234,217,.08); }
.sheet .note { margin: 14px 4px 0; color: var(--dune); font-size: 13.5px; line-height: 1.4; }

/* photo gallery */
.gal { position: fixed; z-index: 7; inset: 0; background: var(--ink); display: none; flex-direction: column; }
.gal.open { display: flex; }
.gal header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: calc(10px + env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) 10px max(14px, env(safe-area-inset-left, 0px)); }
.gal header b { font: 500 20px/1.2 var(--display); }
.gal header small { color: var(--dune); font-size: 14px; font-variant-numeric: tabular-nums; margin-inline-start: 8px; }
.strip { flex: 1; min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
.strip::-webkit-scrollbar { display: none; }
.strip figure { flex: 0 0 100%; height: 100%; margin: 0; scroll-snap-align: center; display: grid; place-items: center; padding: 0 max(8px, env(safe-area-inset-left, 0px)); }
.strip img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; border-radius: 4px; }
.gal footer { display: flex; justify-content: center; gap: 10px; padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px)); }
.gal .arrows { display: none; }
@media (hover: hover) { .gal .arrows { display: flex; gap: 10px; } }

@media (min-width: 760px) {
  .brand { font-size: 24px; }
  .cap h1 { font-size: 28px; }
  .cap p { font-size: 15px; }
  .cap { max-width: 380px; padding: 12px 18px 14px; }
}
/* wide screens: the room list stays open at the side, the video stands as a tall column */
@media (min-width: 960px) and (min-aspect-ratio: 1/1) {
  :root { --side: 340px; }
  .rooms { display: flex !important; inset: 0 0 0 auto; width: var(--side); background: var(--ink); backdrop-filter: none; -webkit-backdrop-filter: none; border-left: 1px solid rgba(243,234,217,.1); }
  .sheet { width: 100%; }
  #menu, #close { display: none !important; }
  #stage.wide video { object-fit: contain; }
}
@media (max-height: 700px) {
  .wa { padding: 12px 16px; font-size: 16px; }
  .bottom { padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
  .walk { bottom: calc(72px + env(safe-area-inset-bottom, 0px)); gap: 8px; }
  .ctl .go { width: 56px; height: 56px; }
}
@media (prefers-reduced-motion: reduce) { .hint, .cap { transition: none; } #stage video { transition: none; } }
</style>
</head>
<body>

<div id="stage" aria-label="סרטון הליכה בבית. לחיצה עוצרת וממשיכה, החלקה למעלה עוברת לחדר הבא.">
  <video id="v" playsinline muted preload="auto"></video>
</div>
<div class="load" id="load" hidden></div>
<div class="fastTag" id="fastTag" hidden>הולכים מהר</div>

<div class="top">
  <button class="btn" id="photos" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg><span id="photosN">תמונות</span></button>
  <div class="brand">וילת צלילים</div>
  <button class="btn" id="menu" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="1.5"/><path d="M3 12h9M12 3v13M12 16h9"/></svg>חדרים</button>
</div>

<div class="cap" id="cap" aria-live="polite"><div class="where" id="where"></div><h1 id="room"></h1><p id="line"></p></div>

<div class="hint" id="hint">הסיור הולך לבד.<br>לחיצה עוצרת וממשיכה, החלקה למעלה מדלגת לחדר הבא, ולחיצה ארוכה מזרזת.</div>

<div class="walk">
  <div class="bar" id="bar" role="slider" tabindex="0" aria-label="מיקום בסיור" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="track"></div><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>
  <div class="ctl">
    <button class="btn" id="prev" aria-label="החדר הקודם"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>הקודם</button>

      <svg id="icWalk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="1.6"/><path d="M10 21l2-6 3 3v4M7 13l3-5 4 2 2 3M14 21l-1-4"/></svg>
      <svg id="icPause" viewBox="0 0 24 24" fill="currentColor" hidden><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      <svg id="icAgain" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M4 12a8 8 0 1 1 3 6.2"/><path d="M4 6v6h6"/></svg>
    </button>
    <button class="btn" id="next" aria-label="החדר הבא">הבא<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
  </div>
</div>

<div class="bottom">
  <a class="wa" id="wa" href="#" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.2-.2-.5-.3z"/></svg>
    לתיאום בוואטסאפ
  </a>
</div>

<div class="rooms" id="rooms" role="dialog" aria-label="חדרים">
  <div class="sheet" id="sheet">
    <h2>מפת הבית <button class="btn" id="close" aria-label="סגירה"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h2>
  </div>
</div>

<div class="gal" id="gal" role="dialog" aria-label="תמונות החדר">
  <header><div><b id="galName"></b><small id="galN"></small></div><button class="btn" id="galClose" aria-label="סגירה"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
  <div class="strip" id="strip"></div>
  <footer><div class="arrows"><button class="btn" id="galPrev" aria-label="התמונה הקודמת"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button><button class="btn" id="galNext" aria-label="התמונה הבאה"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button></div></footer>
</div>

<script>
document.documentElement.lang = 'he'; document.documentElement.dir = 'rtl';
// Phone from the villa's Google card. Change here if needed.
var WHATSAPP_PHONE = "972525257701";
var WHATSAPP_TEXT = "היי, ראיתי את הסיור בוילת צלילים ואשמח לתאם";

// Video files: "hi" for tablets and computers, "lo" for phones. Seconds are at normal walking speed.
var SRC = {"hi": "video/tour-1080.mp4", "lo": "video/tour-720.mp4", "poster": "video/poster.jpg", "thumbs": "video/th/", "img": "img/", "dur": 153.6};

// Rooms for the list and the captions. "at" is where in the video the room is best seen (null: photos only).
var ROOMS = [
  { sec: "הכניסה", name: "הרחוב והכניסה", at: 1.0, line: "הבית מהרחוב, החצר הקדמית ודלת הכניסה.", photos: ["74", "73"] },
  { sec: "הבית", name: "הסלון", at: 10.0, line: "סלון גדול ומואר, עם ספה, כורסאות וספריה צהובה.", photos: ["06", "07", "04", "03", "01"] },
  { name: "פינת האוכל", at: 15.0, line: "שולחן עץ ארוך עם כיסאות צהובים, ליד חלון.", photos: ["24", "02", "16"] },
  { name: "המטבח", at: 20.0, line: "מטבח לבן ומרווח, עם פתח אל הסלון ופינת קפה.", photos: ["10", "12", "15", "13", "14"] },
  { name: "המסדרון ושירותי האורחים", at: 44.0, line: "מסדרון עם כיור ושירותי אורחים, ליד הסלון.", photos: ["23", "22"] },
  { name: "המדרגות", at: 52.0, line: "מדרגות לבנות אל הקומה העליונה, ומדרגות עץ אל המפלס התחתון.", photos: ["19"] },
  { sec: "המפלס התחתון", name: "פינת הטלוויזיה", at: 57.0, line: "פינת ישיבה נוספת במפלס התחתון, עם ספה, טלוויזיה ומכשיר כושר.", photos: ["09", "50", "49", "51"] },
  { name: "חדר ילדים", at: 63.0, line: "מיטה זוגית ממתכת לבנה ומיטת קומתיים.", photos: ["46", "47", "45"] },
  { name: "חדר שינה זוגי", at: 75.0, line: "חדר שינה זוגי עם וילונות לכל גובה הקיר, ארון מראה וחדר רחצה צמוד.", photos: ["52", "54"] },
  { name: "חדר הרחצה הצמוד", at: 80.0, line: "מקלחת וכיור, עם רצפה בצבע טורקיז.", photos: ["55", "56"] },
  { name: "חדר רחצה עם אמבטיה", at: 88.0, line: "אמבטיה, מקלחת וכיור, עם רצפה סגולה.", photos: ["61", "59"] },
  { name: "חדר שינה נוסף", at: 95.0, line: "חדר שינה זוגי עם ספה כחולה ודלת אל החצר.", photos: ["57", "58"] },
  { sec: "הקומה העליונה", name: "המסדרון העליון", at: 107.0, line: "מסדרון עליון עם קיר בלוקים מעוטר, ומבט אל הסלון למטה.", photos: ["43", "44"] },

  { name: "חדר ילדים, למעלה", at: 113.0, line: "מיטה זוגית, מיטת קומתיים וארונות, מתחת לתקרת קורות.", photos: ["37", "39"] },
  { sec: "החצר", name: "הפרגולה", at: null, line: "פרגולה גדולה עם שולחן אוכל, פינת ישיבה, שולחן פינג פונג וערסל.", photos: ["85", "86", "84"] },

  var curRoom = -1, capT = null;

    var img = new Image(); img.alt = ''; img.loading = 'lazy'; img.src = SRC.thumbs + i + '.jpg';

    sp.appendChild(n); sp.appendChild(s); b.appendChild(img); b.appendChild(sp);
